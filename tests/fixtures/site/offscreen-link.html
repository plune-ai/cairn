<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Off-screen link — Fixture</title>
    <style>
      .skip { position: absolute; top: -10em; left: 0; }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <main id="main">
      <h1>Page</h1>
      <a href="/other">Other page</a>
    </main>
  </body>
</html>
