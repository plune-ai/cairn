<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nothing safe outside — Fixture</title>
    <style>
      [hidden] { display: none !important; }
      body { margin: 0; }
      /* Every point of the viewport outside the dialog is a link that changes data. */
      #grid { position: fixed; inset: 0; display: grid; grid-template-columns: repeat(10, 1fr); grid-auto-rows: 10vh; }
      #grid a { display: block; border: 1px solid #ccc; }
      #open { position: fixed; top: 45vh; left: 45vw; z-index: 5; }
      .dialog { position: fixed; top: 20%; left: 30%; width: 40%; background: #fff; padding: 1rem; border: 1px solid #333; z-index: 10; }
    </style>
  </head>
  <body>
    <nav id="grid" aria-label="Quick actions"></nav>
    <button type="button" id="open" aria-haspopup="dialog">Help</button>
    <div id="help" class="dialog" role="dialog" aria-modal="true" aria-label="Help" hidden>
      <h2>Help</h2>
      <button type="button" id="close" aria-label="Close">×</button>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      for (let i = 0; i < 100; i++) {
        const a = document.createElement("a");
        a.href = "#";
        a.textContent = "Do " + i;
        a.addEventListener("click", (e) => { e.preventDefault(); fetch("/api/quick/" + i, { method: "POST" }); });
        $("grid").append(a);
      }
      $("open").addEventListener("click", () => { $("help").hidden = false; });
      $("close").addEventListener("click", () => { $("help").hidden = true; });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("help").hidden = true; });
    </script>
  </body>
</html>
